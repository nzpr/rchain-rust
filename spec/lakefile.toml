name = "rchain-spec"
version = "0.1.0"
defaultTargets = ["Rchain"]

# Phase 0 is deliberately dependency-free so `lake build` works offline and fast.
#
# Mathlib is added in Phase 1 when the proofs need Multiset/Finset/Order. To do so:
#
#   require mathlib from git
#     "https://github.com/leanprover-community/mathlib4.git" @ "v4.12.0"
#
# and add `import Mathlib` at the top of the modules that use it.

[[lean_lib]]
name = "Rchain"
