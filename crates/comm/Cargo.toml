[package]
name = "rchain-comm"
version = "0.1.0"
edition = "2021"
description = "Faithful Rust port of the RChain comm module (peer-to-peer networking)."

[dependencies]
crossbeam = "0.8"
rchain-models = { path = "../models" }
rchain-shared = { path = "../shared" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
